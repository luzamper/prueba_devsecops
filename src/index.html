<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba DevSecOps</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="header__title">Prueba DevSecOps</h1>
      <p class="header__subtitle">Proyecto base de capacitacion</p>
    </header>

    <main class="main">
      <section class="card">
        <h2 class="card__title">Estado</h2>
        <p class="card__text" id="status">Cargando...</p>
      </section>

      <section class="card">
        <h2 class="card__title">Registrar incidencia</h2>
        <form id="form-incidencia" class="form" novalidate>
          <div class="campo">
            <label class="campo__etiqueta" for="titulo">Titulo</label>
            <input
              class="campo__control"
              id="titulo"
              name="titulo"
              type="text"
              autocomplete="off"
              aria-describedby="error-titulo"
            />
            <p class="campo__error" id="error-titulo"></p>
          </div>

          <div class="campo">
            <label class="campo__etiqueta" for="descripcion">Descripcion</label>
            <textarea
              class="campo__control"
              id="descripcion"
              name="descripcion"
              rows="3"
              aria-describedby="error-descripcion"
            ></textarea>
            <p class="campo__error" id="error-descripcion"></p>
          </div>

          <div class="campo">
            <label class="campo__etiqueta" for="severidad">Severidad</label>
            <select
              class="campo__control"
              id="severidad"
              name="severidad"
              aria-describedby="error-severidad"
            >
              <option value="">Seleccione...</option>
              <option value="baja">Baja</option>
              <option value="media">Media</option>
              <option value="alta">Alta</option>
              <option value="critica">Critica</option>
            </select>
            <p class="campo__error" id="error-severidad"></p>
          </div>

          <div class="card__actions">
            <button type="submit" class="button">Registrar</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2 class="card__title">Incidencias</h2>
        <p class="card__text" id="resumen">Sin incidencias registradas</p>
        <ul class="listado" id="listado"></ul>
      </section>
    </main>

    <footer class="footer">
      <small>Consorcio Minero Horizonte &middot; entorno de pruebas</small>
    </footer>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
