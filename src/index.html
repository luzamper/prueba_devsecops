<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba DevSecOps</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="header__title">Prueba DevSecOps</h1>
      <p class="header__subtitle">Proyecto base de capacitacion</p>
    </header>

    <main class="main">
      <section class="card">
        <h2 class="card__title">Estado</h2>
        <p class="card__text" id="status">Cargando...</p>
      </section>

      <section class="card">
        <h2 class="card__title">Contador</h2>
        <p class="card__text">Valor: <output id="counter">0</output></p>
        <div class="card__actions">
          <button type="button" class="button" id="increment">Sumar</button>
          <button type="button" class="button button--ghost" id="reset">Reiniciar</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <small>Consorcio Minero Horizonte &middot; entorno de pruebas</small>
    </footer>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
