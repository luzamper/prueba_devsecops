name: Analisis de dependencias

# Dos defensas complementarias:
#  - auditoria: npm audit sobre lo que ya hay en package-lock.json.
#  - revision: en un PR, bloquea dependencias nuevas con vulnerabilidades.
# La ejecucion semanal detecta CVE publicados despues de fusionar, aunque
# nadie haya tocado el codigo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 13 * * 1" # lunes 13:00 UTC
  workflow_dispatch:

# Permisos minimos: solo lectura del codigo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auditoria:
    name: Auditoria con npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Falla ante hallazgos de severidad moderate o superior.
      - name: Auditar vulnerabilidades
        run: npm audit --audit-level=moderate

      # Pendiente: 'npm audit signatures' verifica la procedencia de los paquetes,
      # pero falla si no hay dependencias instaladas. Agregarlo cuando existan.

      # Se publica aunque la auditoria falle, para poder revisar el detalle.
      - name: Guardar el informe
        if: always()
        run: npm audit --json > npm-audit.json || true

      - name: Publicar el informe
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit
          path: npm-audit.json
          retention-days: 7
          if-no-files-found: error

  revision:
    name: Revision de dependencias nuevas
    # Solo tiene sentido en un PR: compara la rama contra la base.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Revisar el cambio de dependencias
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
